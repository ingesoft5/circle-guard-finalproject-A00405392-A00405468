  # Librerias Java de los 8 servicios (revisado el 2026-11-18): 74 CVE con arreglo, todos en los jar y ninguno en el sistema
  # operativo de la imagen. Vienen de Spring Boot 3.2.4 y las versiones que arrastra (Spring Framework 6.1, Spring Security 6.2,
