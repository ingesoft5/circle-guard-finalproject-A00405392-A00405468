  # 8 servicios a la vez y choca con la observabilidad (HU-20 a HU-22, que tambien toca Micrometer y las dependencias), asi que va
  # en una historia propia despues de esa. Un CVE NUEVO sigue bloqueando. Vence el 2026-12-31.
