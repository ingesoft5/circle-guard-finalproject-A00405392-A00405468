# Configuración de Jenkins como código (JCasC). Los ${...} vienen del .env generado
# por infra/bootstrap/bootstrap-tools.sh; aquí no hay ningún secreto.
jenkins:
  systemMessage: "CircleGuard CI/CD · configurado por JCasC desde infra/tools/jenkins/casc/jenkins.yaml"
  numExecutors: 2   # cg-tools (16 GB) también corre SonarQube y Nexus: 3 builds de Gradle con Testcontainers no caben
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
        - id: "jmrojas06"
          password: "${JENKINS_JMROJAS06_PASSWORD}"
        - id: "pierrecuevas"
          password: "${JENKINS_PIERRECUEVAS_PASSWORD}"
        - id: "docente"
          password: "${JENKINS_DOCENTE_PASSWORD}"
  # RBAC (HU-23): tres niveles y nada para el anonimo (sin entrada en la matriz no puede ni ver Jenkins).
  #   Administrador (admin, jmrojas06): configura Jenkins, plugins, credenciales y nodos.
  #   Desarrollo (pierrecuevas): lanza, cancela y repite builds, lee logs y aprueba el paso a prod (el `input` del Jenkinsfile
  #     lo limita a submitter jmrojas06,pierrecuevas); NO administra ni ve credenciales.
  #   Lectura (docente): jobs, ejecuciones y reportes.
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "admin"
            permissions: ["Overall/Administer"]
        - user:
            name: "jmrojas06"
            permissions: ["Overall/Administer"]
        - user:
            name: "pierrecuevas"
            permissions: ["Overall/Read", "Job/Read", "Job/Build", "Job/Cancel", "Job/Workspace", "Run/Replay", "View/Read"]
        # Docente: solo lectura de jobs, ejecuciones y reportes.
        - user:
            name: "docente"
            permissions: ["Overall/Read", "Job/Read", "View/Read"]
  globalNodeProperties:
    - envVars:
        env:
          - key: REGISTRY
            value: "${REGISTRY}"
          - key: DEV_HOST
            value: "${DEV_HOST}"
          - key: STAGE_HOST
            value: "${STAGE_HOST}"
          - key: PROD_HOST
            value: "${PROD_HOST}"
          - key: DEV_URL
            value: "${DEV_URL}"
          - key: STAGE_URL
            value: "${STAGE_URL}"
          - key: PROD_URL
            value: "${PROD_URL}"
          # HU-16: Terraform y Kubernetes en AWS. Todas con valor por defecto vacío: un Jenkins sin ellas arranca igual
          # que antes (los jobs circleguard-infra/drift y TARGET=k8s fallan diciendo qué falta). Ninguna se versiona.
          - key: TF_STATE_BUCKET
            value: "${TF_STATE_BUCKET:-}"
          - key: TF_VAR_admin_cidrs
            value: "${TF_VAR_admin_cidrs:-}"
          - key: TF_VAR_tools_cidr
            value: "${TF_VAR_tools_cidr:-}"
          - key: TF_VAR_ssh_public_key
            value: "${TF_VAR_ssh_public_key:-}"
          - key: TF_VAR_alert_email
            value: "${TF_VAR_alert_email:-}"
          - key: ECR_REGISTRY
            value: "${ECR_REGISTRY:-}"
          - key: ACME_EMAIL
            value: "${ACME_EMAIL:-}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              id: "github-token"
              description: "GitHub: checkout, estado de los PR y releases"
              scope: GLOBAL
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
          - usernamePassword:
              id: "nexus-ci"
              description: "Nexus: publicar y descargar imágenes"
              scope: GLOBAL
              username: "ci"
              password: "${NEXUS_CI_PASSWORD}"
          - usernamePassword:
              id: "aws-terraform"
              description: "AWS: Terraform (jobs circleguard-infra y circleguard-drift) y ECR. Usuario de IAM propio de Jenkins, no el de administración"
              scope: GLOBAL
              username: "${AWS_ACCESS_KEY_ID:-sin-configurar}"
              password: "${AWS_SECRET_ACCESS_KEY:-sin-configurar}"
          - string:
              id: "sonar-token"
              description: "SonarQube: token de análisis"
              scope: GLOBAL
              secret: "${SONAR_TOKEN}"
          - string:
              id: "discord-webhook"
              description: "Discord: notificaciones del pipeline"
              scope: GLOBAL
              secret: "${DISCORD_WEBHOOK_URL}"
          - string:
              id: "whatsapp-recipients"
              description: "WhatsApp (CallMeBot): telefono:apikey separados por coma"
              scope: GLOBAL
              secret: "${WHATSAPP_RECIPIENTS}"
          - basicSSHUserPrivateKey:
              id: "deploy-ssh"
              description: "SSH a las VMs de dev, stage y prod"
              scope: GLOBAL
              username: "ubuntu"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/deploy_key}"

unclassified:
  location:
    url: "${JENKINS_URL}"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "sonarqube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"
  globalLibraries:
    libraries:
      - name: "circleguard"
        defaultVersion: "main"
        implicit: false
        allowVersionOverride: true
        retriever:
          modernSCM:
            libraryPath: "jenkins/"
            scm:
              git:
                remote: "https://github.com/${GITHUB_REPO}.git"
                credentialsId: "github-token"

jobs:
  - script: |
      multibranchPipelineJob('circleguard') {
        displayName('CircleGuard')
        description('Pipeline multibranch: CI en cada PR, CD desde main. Se dispara por webhook de GitHub.')
        branchSources {
          branchSource {
            source {
              github {
                id('circleguard-github')
                repoOwner('${GITHUB_REPO_OWNER}')
                repository('${GITHUB_REPO_NAME}')
                repositoryUrl('https://github.com/${GITHUB_REPO}')
                configuredByUrl(true)
                credentialsId('github-token')
                traits {
                  gitHubBranchDiscovery { strategyId(1) }          // ramas, excepto las que ya son PR
                  gitHubPullRequestDiscovery { strategyId(1) }     // PR fusionado con main
                }
              }
            }
          }
        }
        orphanedItemStrategy { discardOldItems { numToKeep(10) } }
        triggers { periodicFolderTrigger { interval('1d') } }      // respaldo si se pierde un webhook
      }
  - script: |
      // HU-10 (#17): rollback = volver a desplegar una versión anterior (inmutable) ya publicada en Nexus.
      pipelineJob('circleguard-rollback') {
        displayName('CircleGuard · Rollback')
        description('Devuelve dev, stage o prod a una versión anterior ya publicada en Nexus. Corre jenkins/rollback.Jenkinsfile de main.')
        parameters {
          choiceParam('ENV', ['dev', 'stage', 'prod'], 'Ambiente a devolver')
          stringParam('VERSION', '', 'Versión a restaurar, sin la v (p. ej. 1.1.0). Ver GitHub Releases o el historial del ambiente.')
        }
        logRotator { numToKeep(20) }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/${GITHUB_REPO}.git')
                  credentials('github-token')
                }
                branch('*/main')
              }
            }
            scriptPath('jenkins/rollback.Jenkinsfile')
            lightweight(true)
          }
        }
      }
  - script: |
      // HU-16 (#23): Terraform gobernado por Jenkins. plan -> aprobación (prod y destroy) -> apply de UN ambiente.
      pipelineJob('circleguard-infra') {
        displayName('CircleGuard · Infraestructura (Terraform)')
        description('Valida, escanea y aplica Terraform en un ambiente (dev, stage, prod o tools). En prod y en destroy pide aprobación. Corre jenkins/infra.Jenkinsfile de main.')
        parameters {
          choiceParam('ENV', ['dev', 'stage', 'prod', 'tools'], 'Ambiente de Terraform')
          choiceParam('ACTION', ['plan', 'apply', 'destroy'], 'plan solo muestra; apply crea o cambia; destroy borra todo el ambiente')
          stringParam('TARGET', '', 'Opcional: limita a un recurso o módulo (-target), p. ej. module.registry en tools')
        }
        logRotator { numToKeep(20) }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/${GITHUB_REPO}.git')
                  credentials('github-token')
                }
                branch('*/main')
              }
            }
            scriptPath('jenkins/infra.Jenkinsfile')
            lightweight(true)
          }
        }
      }
  - script: |
      // HU-16 (#23): plan programado que detecta cambios hechos a mano en AWS (drift). Cada día; solo mira lo que está desplegado.
      pipelineJob('circleguard-drift') {
        displayName('CircleGuard · Drift de Terraform')
        description('Plan programado (cada día) de cada ambiente desplegado: avisa si alguien cambió algo a mano en la consola. Corre jenkins/drift.Jenkinsfile de main.')
        logRotator { numToKeep(30) }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/${GITHUB_REPO}.git')
                  credentials('github-token')
                }
                branch('*/main')
              }
            }
            scriptPath('jenkins/drift.Jenkinsfile')
            lightweight(true)
          }
        }
      }
  - script: |
      // HU-16 (#23): despliega o revierte una versión ya publicada en un ambiente de Kubernetes en AWS.
      pipelineJob('circleguard-k8s') {
        displayName('CircleGuard · Despliegue en Kubernetes')
        description('Despliega (o devuelve) una versión ya publicada en Nexus en dev, stage o prod de Kubernetes. En prod pide aprobación. Corre jenkins/k8s.Jenkinsfile de main.')
        parameters {
          choiceParam('ENV', ['dev', 'stage', 'prod'], 'Ambiente de Kubernetes (debe existir: circleguard-infra)')
          stringParam('VERSION', '', 'Versión a desplegar, sin la v (p. ej. 1.4.0)')
          choiceParam('TLS_ISSUER', ['letsencrypt-staging', 'letsencrypt'], 'Emisor del certificado')
        }
        logRotator { numToKeep(20) }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/${GITHUB_REPO}.git')
                  credentials('github-token')
                }
                branch('*/main')
              }
            }
            scriptPath('jenkins/k8s.Jenkinsfile')
            lightweight(true)
          }
        }
      }
