# CircleGuard · Parte 1: base común de los 3 ambientes (dev, stage, prod).
# Middleware + 5 servicios núcleo + cliente web. Cada ambiente agrega su override:
#   ./deploy/compose/compose.sh <dev|stage|prod> up -d --wait
# Las imágenes son las MISMAS en los 3 ambientes; solo cambian IMAGE_TAG y la configuración.
# Los secretos vienen del .env del ambiente (fuera del repo); ver .env.example.

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "3" }

x-spring-env: &spring-env
  DB_HOST: postgres
  DB_USER: ${DB_USER:-circleguard}
  DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  REDIS_HOST: redis
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Define NEO4J_PASSWORD en .env}
  JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
  QR_SECRET: ${QR_SECRET:?Define QR_SECRET en .env}
  CIRCLEGUARD_ENV: ${CIRCLEGUARD_ENV:-local}

services:
  # ---------------------------------------------------------------- middleware
  postgres:
    <<: *service-defaults
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-circleguard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      POSTGRES_DB: circleguard
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d circleguard"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    <<: *service-defaults
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Define NEO4J_PASSWORD en .env}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  kafka:
    <<: *service-defaults
    image: apache/kafka:3.8.0
    environment:
      # KRaft (sin ZooKeeper): un solo nodo que es broker y controlador.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s

  redis:
    <<: *service-defaults
    image: redis:7.2.5-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------- servicios núcleo
  identity:
    <<: *service-defaults
    image: ${REGISTRY:-local}/circleguard/circleguard-identity-service:${IMAGE_TAG:?Define IMAGE_TAG}
    environment:
      <<: *spring-env
      DB_NAME: circleguard_identity
      VAULT_SECRET: ${VAULT_SECRET:?Define VAULT_SECRET en .env}
      VAULT_SALT: ${VAULT_SALT:?Define VAULT_SALT en .env}
      VAULT_HASH_SALT: ${VAULT_HASH_SALT:?Define VAULT_HASH_SALT en .env}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  auth:
    <<: *service-defaults
    image: ${REGISTRY:-local}/circleguard/circleguard-auth-service:${IMAGE_TAG:?Define IMAGE_TAG}
    environment:
      <<: *spring-env
      DB_NAME: circleguard_auth
      IDENTITY_URL: http://identity:8083
      # LDAP es opcional: si no responde, auth usa las cuentas locales (super_admin, etc.).
      LDAP_URL: ${LDAP_URL:-ldap://ldap.invalid:389}
      LDAP_PASSWORD: ${LDAP_PASSWORD:-sin-ldap}
    depends_on:
      postgres: { condition: service_healthy }
      identity: { condition: service_healthy }

  form:
    <<: *service-defaults
    image: ${REGISTRY:-local}/circleguard/circleguard-form-service:${IMAGE_TAG:?Define IMAGE_TAG}
    environment:
      <<: *spring-env
      DB_NAME: circleguard_form
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  promotion:
    <<: *service-defaults
    image: ${REGISTRY:-local}/circleguard/circleguard-promotion-service:${IMAGE_TAG:?Define IMAGE_TAG}
    environment:
      <<: *spring-env
      DB_NAME: circleguard_promotion
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }

  gateway:
    <<: *service-defaults
    image: ${REGISTRY:-local}/circleguard/circleguard-gateway-service:${IMAGE_TAG:?Define IMAGE_TAG}
    environment:
      <<: *spring-env
    depends_on:
      redis: { condition: service_healthy }

  # ------------------------------------------------------------ cliente web
  web:
    <<: *service-defaults
    image: ${REGISTRY:-local}/circleguard/circleguard-web:${IMAGE_TAG:?Define IMAGE_TAG}
    ports:
      - "${WEB_PORT:-80}:8080"
    depends_on:
      auth: { condition: service_healthy }
      identity: { condition: service_healthy }
      form: { condition: service_healthy }
      promotion: { condition: service_healthy }
      gateway: { condition: service_healthy }

volumes:
  pgdata:
  neo4jdata:
  kafkadata:
