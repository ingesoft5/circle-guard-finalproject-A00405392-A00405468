# HU-20 (#27) y HU-21 (#28): Prometheus, Grafana y Alertmanager junto al compose de un ambiente:
#   ./deploy/compose/compose.sh dev -f deploy/compose/observability.yml up -d --wait
# Grafana en http://localhost:3000 (o GRAFANA_PORT; usuario admin, contraseña GRAFANA_ADMIN_PASSWORD del .env).
# Solo escuchan en 127.0.0.1: no se publican hacia afuera de la máquina.
# En Kubernetes la plataforma despliega Prometheus y Grafana; los dashboards son estos mismos archivos.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # HU-21: Alertmanager agrupa las alertas y notifica al receptor.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Receptor de notificaciones para el compose: imprime cada alerta en su log.
  alert-sink:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python", "-u", "/sink/sink.py"]
    volumes:
      - ../observability/alert-sink/sink.py:/sink/sink.py:ro
      - alertlog:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]   # 127.0.0.1: en alpine localhost resuelve a IPv6
      interval: 10s
      timeout: 5s
      retries: 10

  # Lag de los consumidores de Kafka, leído del broker (alerta LagKafkaAlto).
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka: { condition: service_healthy }

volumes:
  promdata:
  alertlog:
