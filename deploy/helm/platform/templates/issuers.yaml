---
# CA propia: un emisor autofirmado crea el certificado raiz (isCA) y de ese certificado cuelga el emisor "circleguard-ca"
# que firma los certificados de los Ingress. Sirve donde no hay dominio publico (local) y para probar el flujo completo;
# se confia en ella importando su certificado (kubectl -n cert-manager get secret circleguard-ca -o jsonpath='{.data.ca\.crt}').
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: circleguard-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: circleguard-ca
  namespace: {{ .Release.Namespace }}
spec:
  isCA: true
  commonName: circleguard-ca
  secretName: circleguard-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: circleguard-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: circleguard-ca
spec:
  ca:
    secretName: circleguard-ca
{{- if .Values.acme.email }}
{{- range $name, $server := dict "letsencrypt-staging" "https://acme-staging-v02.api.letsencrypt.org/directory" "letsencrypt" "https://acme-v02.api.letsencrypt.org/directory" }}
---
# Let's Encrypt por HTTP-01: cert-manager crea un Ingress temporal que Traefik publica en el puerto 80 con el nombre del
# host (por eso el host debe resolver a la IP publica del nodo, p. ej. <ip-con-guiones>.sslip.io). "-staging" no emite
# certificados de confianza pero no tiene limites: se prueba primero ahi.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
spec:
  acme:
    server: {{ $server }}
    email: {{ $.Values.acme.email }}
    privateKeySecretRef:
      name: {{ $name }}-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ $.Values.acme.ingressClass }}
{{- end }}
{{- end }}
