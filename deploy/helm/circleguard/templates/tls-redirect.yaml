{{- if and .Values.ingress.enabled .Values.ingress.tls.enabled }}
---
# HTTP -> HTTPS (redireccion permanente). El desafio de Let's Encrypt (/.well-known/acme-challenge/...) lo atiende otra ruta mas especifica que
# crea cert-manager, asi que no pasa por esta redireccion.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  labels:
    {{- include "cg.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: circleguard-http
  labels:
    {{- include "cg.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-redirect-https@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}   # con TLS, ingress.yaml ya exige que no este vacio
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: {{ .Values.services.web.port }}
{{- end }}
