---
# Identidad de TODOS los pods de la aplicacion. Ninguno habla con la API de Kubernetes, asi que no tiene permisos
# ni se le monta token: si alguien entra a un contenedor, no puede leer Secrets ni tocar el cluster desde ahi.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: circleguard-workload
  labels:
    {{- include "cg.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.rbac.viewer }}
---
# Para operar y para el docente: ver el estado del namespace sin poder cambiarlo ni leer Secrets.
# Token temporal: kubectl -n <namespace> create token circleguard-viewer
apiVersion: v1
kind: ServiceAccount
metadata:
  name: circleguard-viewer
  labels:
    {{- include "cg.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: circleguard-viewer
  labels:
    {{- include "cg.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, configmaps, events, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: circleguard-viewer
  labels:
    {{- include "cg.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: circleguard-viewer
subjects:
  - kind: ServiceAccount
    name: circleguard-viewer
    namespace: {{ .Release.Namespace }}
{{- end }}
