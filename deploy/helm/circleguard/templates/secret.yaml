{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: circleguard-secrets
  labels:
    {{- include "cg.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secrets.dbPassword es obligatorio (o usa existingSecret)" .Values.secrets.dbPassword | quote }}
  NEO4J_PASSWORD: {{ required "secrets.neo4jPassword es obligatorio (o usa existingSecret)" .Values.secrets.neo4jPassword | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret es obligatorio (o usa existingSecret)" .Values.secrets.jwtSecret | quote }}
  QR_SECRET: {{ required "secrets.qrSecret es obligatorio (o usa existingSecret)" .Values.secrets.qrSecret | quote }}
  VAULT_SECRET: {{ required "secrets.vaultSecret es obligatorio (o usa existingSecret)" .Values.secrets.vaultSecret | quote }}
  VAULT_SALT: {{ required "secrets.vaultSalt es obligatorio (o usa existingSecret)" .Values.secrets.vaultSalt | quote }}
  VAULT_HASH_SALT: {{ required "secrets.vaultHashSalt es obligatorio (o usa existingSecret)" .Values.secrets.vaultHashSalt | quote }}
  LDAP_PASSWORD: {{ .Values.secrets.ldapPassword | quote }}
{{- end }}
