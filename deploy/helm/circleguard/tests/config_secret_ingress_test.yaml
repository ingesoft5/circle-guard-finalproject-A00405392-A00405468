suite: configuracion, secretos e ingress
templates:
  - templates/configmap.yaml
  - templates/secret.yaml
  - templates/ingress.yaml
set:
  global:
    environment: dev
  secrets:
    dbPassword: "pw-db"
    neo4jPassword: "pw-neo"
    jwtSecret: "jwt"
    qrSecret: "qr"
    vaultSecret: "vs"
    vaultSalt: "vsalt"
    vaultHashSalt: "vhash"
tests:
  - it: el ConfigMap lleva solo configuracion no secreta con los nombres de los Service
    template: templates/configmap.yaml
    asserts:
      - equal:
          path: metadata.name
          value: circleguard-config
      - equal:
          path: data.DB_HOST
          value: postgres
      - equal:
          path: data.KAFKA_BOOTSTRAP_SERVERS
          value: kafka:9092
      - equal:
          path: data.REDIS_HOST
          value: redis
      - equal:
          path: data.NEO4J_URI
          value: bolt://neo4j:7687
      - equal:
          path: data.CIRCLEGUARD_ENV
          value: dev
      - notExists:
          path: data.DB_PASSWORD

  - it: el Secret se crea con los valores indicados
    template: templates/secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: circleguard-secrets
      - equal:
          path: stringData.DB_PASSWORD
          value: pw-db
      - equal:
          path: stringData.LDAP_PASSWORD
          value: sin-ldap

  - it: falla si falta un secreto obligatorio
    template: templates/secret.yaml
    set:
      secrets.jwtSecret: ""
    asserts:
      - failedTemplate:
          errorMessage: "secrets.jwtSecret es obligatorio (o usa existingSecret)"

  - it: no crea el Secret si se usa uno existente
    template: templates/secret.yaml
    set:
      existingSecret: secretos-sellados
      secrets.jwtSecret: ""
    asserts:
      - hasDocuments:
          count: 0

  - it: el Ingress envia todo el trafico a la web
    template: templates/ingress.yaml
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: spec.ingressClassName
          value: traefik
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: web
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8080
      - notExists:
          path: spec.rules[0].host

  - it: el Ingress usa el host cuando se indica
    template: templates/ingress.yaml
    set:
      ingress.host: dev.circleguard.example.com
    asserts:
      - equal:
          path: spec.rules[0].host
          value: dev.circleguard.example.com

  - it: sin ingress no se crea nada
    template: templates/ingress.yaml
    set:
      ingress.enabled: false
    asserts:
      - hasDocuments:
          count: 0
