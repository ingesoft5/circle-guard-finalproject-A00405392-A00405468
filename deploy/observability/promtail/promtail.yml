# Promtail (HU-22): lee los logs de los contenedores de CircleGuard por el socket de Docker y los envía a Loki.
# Etiquetas de baja cardinalidad (servicio, nivel); el trace_id queda en la línea JSON y Grafana lo extrae para
# saltar a la traza en Jaeger.
server:
  http_listen_port: 9080
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: circleguard
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project"]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project
    pipeline_stages:
      # Los servicios Spring escriben JSON (logback-spring.xml); el resto (nginx, middleware) queda como texto.
      - json:
          expressions:
            level: level
            service: service
      - labels:
          level:
          service:
