# Prometheus para el compose (HU-20). Lee /actuator/prometheus de cada servicio dentro de la red de
# Docker; el nginx del web no publica esa ruta. En Kubernetes el mismo scrape se hace con
# kubernetes_sd_configs (lo despliega la parte de plataforma); las métricas y los dashboards son los mismos.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: circleguard
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - auth:8180
          - identity:8083
          - form:8086
          - promotion:8088
          - gateway:8087
        labels:
          environment: compose
      # dashboard, file y notification no corren en el compose de la Parte 1; en Kubernetes sí.
