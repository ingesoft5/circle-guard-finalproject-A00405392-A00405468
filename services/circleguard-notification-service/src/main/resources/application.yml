# Configuración por variables de entorno. Los secretos no tienen valor por defecto.
spring:
  application:
    name: circleguard-notification-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # HU-22: la traza viaja en las cabeceras del mensaje (traceparent): producer y consumer con observación.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      # Los servicios publican Map/objetos: sin JsonSerializer Kafka usa StringSerializer y el envío falla.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

auth:
  api:
    url: ${AUTH_API_URL:http://localhost:8180}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

qr:
  secret: ${QR_SECRET}
  expiration: ${QR_EXPIRATION:300000}   # milisegundos (5 min). Antes era 300 = 0.3 s y el QR vencía al instante

management:
  health:
    mail:
      enabled: false   # sin SMTP en la Parte 1; el envío de correo tiene su propio reintento
  endpoints:
    web:
      exposure:
        include: health,prometheus   # HU-20: Prometheus lee /actuator/prometheus (el nginx no lo publica)
  endpoint:
    health:
      probes:
        enabled: true
  # HU-22 (#29): trazas W3C. Con muestreo 0 (por defecto) los logs llevan trace_id pero no se exporta nada;
  # el ambiente con Jaeger fija TRACING_SAMPLING=1.0 y OTLP_TRACING_ENDPOINT (compose: observability.yml).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}   # cada serie lleva el servicio que la produce
    distribution:
      percentiles-histogram:
        http.server.requests: true             # buckets para calcular el p95 en Prometheus (métricas RED)

server:
  port: ${SERVER_PORT:8082}
