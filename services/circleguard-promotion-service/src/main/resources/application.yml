# Configuración por variables de entorno. Los secretos no tienen valor por defecto.
spring:
  application:
    name: circleguard-promotion-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:circleguard_promotion}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # HU-22: la traza viaja en las cabeceras del mensaje (traceparent): producer y consumer con observación.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      # Los servicios publican Map/objetos: sin JsonSerializer Kafka usa StringSerializer y el envío falla.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: promotion-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus   # HU-20: Prometheus lee /actuator/prometheus (el nginx no lo publica)
  endpoint:
    health:
      probes:
        enabled: true
  # HU-22 (#29): trazas W3C. Con muestreo 0 (por defecto) los logs llevan trace_id pero no se exporta nada;
  # el ambiente con Jaeger fija TRACING_SAMPLING=1.0 y OTLP_TRACING_ENDPOINT (compose: observability.yml).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}   # cada serie lleva el servicio que la produce
    distribution:
      percentiles-histogram:
        http.server.requests: true             # buckets para calcular el p95 en Prometheus (métricas RED)

server:
  port: ${SERVER_PORT:8088}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
