# Configuración por variables de entorno. Los secretos no tienen valor por defecto:
# vienen del .env del ambiente (ver deploy/compose/.env.example).
spring:
  application:
    name: circleguard-auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:circleguard_auth}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ldap:
    urls: ${LDAP_URL:ldap://localhost:389}
    base: ${LDAP_BASE:dc=circleguard,dc=edu}
    username: ${LDAP_USER:cn=admin,dc=circleguard,dc=edu}
    password: ${LDAP_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

qr:
  secret: ${QR_SECRET}
  expiration: ${QR_EXPIRATION:300000}   # milisegundos (5 min). Antes era 300 = 0.3 s y el QR vencía al instante

circleguard:
  identity-service:
    url: ${IDENTITY_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8180}
