# Configuración por variables de entorno. Los secretos no tienen valor por defecto.
spring:
  application:
    name: circleguard-gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

qr:
  secret: ${QR_SECRET}
  expiration: ${QR_EXPIRATION:300000}   # milisegundos (5 min). Antes era 300 = 0.3 s y el QR vencía al instante

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8087}
