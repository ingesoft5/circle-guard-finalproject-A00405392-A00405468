# Configuración por variables de entorno. Los secretos no tienen valor por defecto.
spring:
  config:
    # HU-17 (#24): Circuit Breaker + Retry en su propio archivo (docs/patrones/resiliencia.md).
    import: classpath:resilience4j.yml
  application:
    name: circleguard-dashboard-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:circleguard_dashboard}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

circleguard:
  promotion-service:
    url: ${PROMOTION_URL:http://localhost:8088}
    timeout: ${PROMOTION_TIMEOUT:2s}             # conexión y lectura; sin timeout el circuito no se entera

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8084}
